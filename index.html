<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>esm.business</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="esm.business">
<meta name="theme-color" content="#18212C">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url("fonts/SchibstedGrotesk.woff2") format("woff2");font-weight:400 900;font-display:swap}
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212C; --muted:#5A6573; --line:#D5DBE2;
  --ai:#B4401A; --ai-soft:#F7E3DA;
  --sn:#1F7A6B; --sn-soft:#DDEFEA;
  --tech:#2F5D8C; --tech-soft:#DFE9F4;
  --evt:#6A4C93; --evt-soft:#ECE5F5;
  --sov:#8A6400; --sov-soft:#F5EAD0;
  --scrim:rgba(15,20,28,.45); --focus:#2563EB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131920; --surface:#1C242E; --ink:#E8ECF1; --muted:#9AA6B4; --line:#2C3743;
    --ai:#F08A62; --ai-soft:#3D2217; --sn:#4FC1AB; --sn-soft:#16332E;
    --tech:#8DB8E8; --tech-soft:#1B2C40; --evt:#C3A6EA; --evt-soft:#2D2440; --sov:#E0B04A; --sov-soft:#3A2C12;
    --scrim:rgba(0,0,0,.6); --focus:#7AA7FF;
  }
}
:root[data-theme="dark"]{
  --bg:#131920; --surface:#1C242E; --ink:#E8ECF1; --muted:#9AA6B4; --line:#2C3743;
  --ai:#F08A62; --ai-soft:#3D2217; --sn:#4FC1AB; --sn-soft:#16332E;
  --tech:#8DB8E8; --tech-soft:#1B2C40; --evt:#C3A6EA; --evt-soft:#2D2440; --sov:#E0B04A; --sov-soft:#3A2C12;
  --scrim:rgba(0,0,0,.6); --focus:#7AA7FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

header{padding:20px 0 6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(26px,7vw,38px);line-height:1;letter-spacing:-0.03em}
.wm{display:flex;align-items:center;gap:12px}
.wm .logo{width:1.25em;height:1.25em;flex:0 0 auto;border-radius:22%;cursor:pointer}
.wm .spin{transform-origin:256px 256px;transform-box:view-box}
.wm .spin.go{animation:spin 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes spin{from{transform:rotate(-270deg)}to{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.wm .spin.go{animation:none}}
.wm .w1{font-weight:800}
.wm .wdot{font-weight:800;color:var(--ai)}
.wm .w2{font-weight:500;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin-top:8px;max-width:60ch}
.updated{color:var(--muted);font-size:12.5px;margin-top:4px}
.updated:empty{display:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex:0 0 auto}
.lang button{appearance:none;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;gap:4px;padding:10px 0;margin-top:10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{background:var(--c,var(--ink));color:#fff}
.tab .cnt{font-size:12px;opacity:.8;margin-left:4px}

section[hidden]{display:none}
.intro{font-size:15px;color:var(--muted);margin:14px 0 4px;max-width:64ch}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:0 0 auto;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:14px;font-weight:700;margin:14px 0 8px;color:var(--muted)}

.t-ai{--c:var(--ai);--cs:var(--ai-soft)}
.t-esm{--c:var(--sn);--cs:var(--sn-soft)}
.t-tech{--c:var(--tech);--cs:var(--tech-soft)}
.t-evt{--c:var(--evt);--cs:var(--evt-soft)}
.t-sov{--c:var(--sov);--cs:var(--sov-soft)}

/* Karten-Liste */
.card{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:0;border-left:5px solid var(--c);border-radius:12px;padding:13px 14px 12px 15px;margin-bottom:8px}
.card:hover{background:color-mix(in srgb,var(--surface) 92%,var(--c))}
.card .kicker{grid-column:1;font-size:12.5px;font-weight:700;color:var(--c)}
.card .ttl{grid-column:1;font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-0.01em}
.card .src{grid-column:1;font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .m{grid-column:2;grid-row:1/4;align-self:center;text-align:right;font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--c);max-width:110px}
.card .m small{display:block;font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:4px;line-height:1.25}
.card.read .ttl{color:var(--muted);font-weight:600}
.badge{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.saved-dot{color:var(--c);font-weight:800}
.newpill{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--c);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
.card.isnew{box-shadow:inset 0 0 0 1.5px var(--c)}
.tab .cnt.new{display:inline-block;min-width:18px;font-size:11px;font-weight:800;line-height:18px;border-radius:9px;background:var(--c,var(--ink));color:#fff;opacity:1;padding:0 5px;text-align:center}
.tab .cnt.new:empty{display:none}
.tab[aria-selected="true"] .cnt.new{background:#fff;color:var(--c,var(--ink))}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.toolrow:has(.nc:empty){display:none}
.toolrow .nc{font-size:13px;font-weight:700;color:var(--c)}
.linkbtn{appearance:none;border:0;background:none;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
@media (max-width:400px){.card .m{font-size:20px;max-width:88px}}

/* Termine */
.evt{display:grid;grid-template-columns:60px 1fr;gap:14px;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;align-items:start}
.cal{border-radius:8px;text-align:center;padding:6px 0 7px;background:var(--cs);color:var(--c)}
.cal .dd{display:block;font-size:24px;font-weight:800;line-height:1}
.cal .mm{display:block;font-size:12px;font-weight:700}
.evt h3{margin:0 0 2px;font-size:16px;line-height:1.3}
.evt .where{font-size:14px;color:var(--muted)}
.evt .note{font-size:14px;margin:6px 0 0}
.count{display:inline-block;font-size:13px;font-weight:700;margin-top:6px;color:var(--c)}
.evt.past{opacity:.5}
.evlink{font-size:13px;font-weight:700;color:var(--c)}
.ph{font-size:11px;font-weight:700;border:1px dashed var(--c);color:var(--c);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

.empty{background:var(--surface);border-radius:12px;padding:18px;color:var(--muted)}

/* Lese-Blatt */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet-top .kicker{font-size:13px;font-weight:700;color:var(--c)}
.x{appearance:none;border:0;background:var(--surface);border-radius:999px;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer}
.sheet .big{font-size:40px;font-weight:800;letter-spacing:-0.035em;line-height:1;color:var(--c);margin:8px 0 2px}
.sheet .bigsub{font-size:13px;color:var(--muted);margin-bottom:10px}
.sheet h3{font-size:22px;line-height:1.25;margin:4px 0 8px;letter-spacing:-0.015em}
.sheet p{margin:0 0 12px;max-width:66ch}
.client{background:var(--cs);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.client b{display:block;font-size:13px;margin-bottom:2px}
.srcline{font-size:14px;color:var(--muted);margin-bottom:14px}
.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;white-space:nowrap}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

footer{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0 0 8px;max-width:66ch}
aside{display:none}
.cards{display:block}
@media (min-width:1024px){
  body{font-size:15.5px}
  .wrap{max-width:1360px;display:grid;grid-template-columns:230px minmax(0,1fr) 280px;grid-template-rows:auto auto 1fr;column-gap:32px;padding:0 28px 48px}
  header{grid-column:1;grid-row:1;padding-top:28px}
  .brand{flex-direction:column;align-items:flex-start;gap:14px}
  h1{font-size:26px}
  .sub{font-size:13.5px}
  nav.tabs{grid-column:1;grid-row:2;flex-direction:column;align-items:stretch;border:0;padding:16px 0 0;top:0;position:sticky;align-self:start;overflow:visible;background:none}
  .tab{text-align:left;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
  .tab:hover{background:var(--surface)}
  main,section{grid-column:2;grid-row:1 / span 3;padding-top:22px;min-width:0}
  .chips{margin:0;padding:0;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .card,.evt{margin:0;height:100%}
  aside{display:block;grid-column:3;grid-row:1 / span 3;position:sticky;top:0;align-self:start;padding-top:22px}
  aside h2{margin-top:0}
  aside h2+*{margin-bottom:22px}
  .newlist{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:6px}
  .newlist button{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--surface);border-left:4px solid var(--c);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600}
  .newlist b{color:var(--c)}
  .mini{display:grid;grid-template-columns:62px 1fr;gap:0 10px;text-decoration:none;background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .mini .md{grid-row:span 2;font-weight:800;color:var(--c);font-size:14px}
  .mini .mt{font-weight:600;font-size:14px;line-height:1.3}
  .mini .mo{font-size:12.5px;color:var(--muted)}
  footer{grid-column:1;grid-row:3;align-self:end;border:0;margin-top:24px}
  .sheet{left:auto;right:0;top:0;bottom:0;width:460px;max-width:none;max-height:none;margin:0;border-radius:18px 0 0 18px;transform:translateX(105%);padding:20px 26px}
  .sheet .grab{display:none}
  .scrim{background:rgba(15,20,28,.25)}
  body.locked{overflow:auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.ainote{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:6px}
.aibadge{font-size:10px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.aitag{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;gap:6px;align-items:center}
.indep{font-size:12.5px}
/* Search controls stay above the topics on small screens and in the sidebar on desktop. */
.search-controls{margin-top:16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.search-controls label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.search-row{display:flex;gap:6px}
.search-row input{min-width:0;flex:1;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
.search-row button{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 9px;cursor:pointer}
.search-controls .archive-option{display:flex;gap:7px;align-items:center;margin:10px 0 0;font-weight:400}
.archive-option input{accent-color:var(--ai);width:17px;height:17px}
.archive-status{font-size:12px;color:var(--muted);margin:5px 0 0}
.search-filters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.search-filters label{font-size:13px;display:grid;gap:4px}
.search-filters select{max-width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.search-result-count{color:var(--muted);font-size:14px}
.archive-tag{font-weight:500;color:var(--muted)}
</style>
</head>

        <button data-lang="de" aria-pressed="true">DE</button>
        <button data-lang="en" aria-pressed="false">EN</button>

      <label><span data-i="searchTopic"></span><select id="search-topic"></select></label>

</div>

<script src="article-search.js"></script>
<script>
const UI = {

const CATS = {
  ai:{consumer:{de:"Consumer",en:"Consumer"},eri:{de:"Energie, Ressourcen & Industrie",en:"Energy, resources & industrials"},
      fs:{de:"Finanzdienstleistungen",en:"Financial services"},gps:{de:"Öffentlicher Sektor",en:"Government & public services"},
      lshc:{de:"Life Sciences & Gesundheit",en:"Life sciences & health care"},tmt:{de:"Technologie, Medien & Telko",en:"Technology, media & telecom"},
      cross:{de:"Branchenübergreifend",en:"Cross-industry"}},
  sov:{snsov:{de:"ServiceNow souverän",en:"Sovereign ServiceNow"},cloud:{de:"Cloud & Plattformen",en:"Cloud & platforms"},ai:{de:"Souveräne KI",en:"Sovereign AI"},work:{de:"Arbeitsplatz & Verwaltung",en:"Workplace & government"}},
  esm:{sn:{de:"ServiceNow",en:"ServiceNow"},ma:{de:"Acquisitions",en:"Acquisitions"},results:{de:"Ergebnisse",en:"Results"},industry:{de:"Branchenlösungen",en:"Industry solutions"},market:{de:"Markt & Control Towers",en:"Market & control towers"}},
  tech:{mcp:{de:"MCP & Integration",en:"MCP & integration"},gov:{de:"Governance",en:"Governance"},dev:{de:"Entwicklung",en:"Development"}}
};

let ITEMS=[], EVENTS=[], META=null;
let ARCHIVE=[], archiveState="idle", archivePromise=null, includeArchive=false;
let searchQuery="", searchTopic="", searchCategory="";
const allArticles=()=>ArticleSearch.merge(ITEMS,ARCHIVE);
const visibleArticles=()=>includeArchive?allArticles():ITEMS;
const isArchived=i=>!ITEMS.some(current=>current.id===i.id);
async function ensureArchive(){
  if(archiveState==="loaded") return;
  if(archivePromise) return archivePromise;
  archiveState="loading"; updateArchiveStatus();
  archivePromise=(async()=>{
    try{
      const response=await fetch("data/archive.json?v="+Date.now());
      if(!response.ok) throw new Error("Archive HTTP "+response.status);
      const value=await response.json();
      if(!ArticleSearch.validArchive(value)) throw new Error("Invalid archive");
      ARCHIVE=value; archiveState="loaded";
    }catch(error){archiveState="error";console.warn("Archive unavailable",error);}
    finally{archivePromise=null;refreshLists();updateArchiveStatus();}
  })();
  return archivePromise;
}
function updateArchiveStatus(){
  const wanted=includeArchive||(tab==="saved"&&savedIds.some(id=>!ITEMS.some(i=>i.id===id)));
  const key=!wanted?null:archiveState==="loading"?"archiveLoading":archiveState==="error"?"archiveFailed":archiveState==="loaded"&&includeArchive?(ARCHIVE.length?"archiveReady":"archiveEmpty"):null;
  document.getElementById("archive-status").textContent=key?T(key):"";
  document.getElementById("archive-retry").hidden=!(wanted&&archiveState==="error");
}
function searchActive(){return searchQuery.trim().length>0;}
function renderSearchFilters(){
  const topics=document.getElementById("search-topic"), categories=document.getElementById("search-category");
  topics.innerHTML='<option value="">'+T("allTopics")+'</option>'+["ai","esm","sov","tech"].map(k=>'<option value="'+k+'">'+esc(T("tab_"+k))+'</option>').join("");
  topics.value=searchTopic;
  categories.innerHTML='<option value="">'+T("allCategories")+'</option>'+(searchTopic?Object.entries(CATS[searchTopic]).map(([k,v])=>'<option value="'+k+'">'+esc(L(v))+'</option>').join(""):"");
  categories.value=searchCategory; categories.disabled=!searchTopic;
}
function renderSearch(){
  const results=ArticleSearch.search(visibleArticles(),searchQuery,searchTopic,searchCategory);
  document.getElementById("search-count").textContent=T("searchCount").replace("{n}",results.length);
  document.getElementById("search-cards").innerHTML=results.length?results.map(cardHTML).join(""):'<p class="empty">'+T("noResults")+'</p>';
}

/* ---------- Zustand ---------- */
let lang=(navigator.language||"de").toLowerCase().startsWith("de")?"de":"en";
let tab="ai", filt={ai:null,esm:null,tech:null}, savedIds=[], readIds=[];
try{
  const s=JSON.parse(localStorage.getItem("esmbusiness-v1")||"{}");
  if(["de","en"].includes(s.lang)) lang=s.lang;
  if(["ai","esm","sov","tech","events","saved"].includes(s.tab)) tab=s.tab;
  if(Array.isArray(s.saved)) savedIds=s.saved;
  if(Array.isArray(s.read)) readIds=s.read;
}catch(e){}
function save(){ try{ localStorage.setItem("esmbusiness-v1",JSON.stringify({lang,tab,saved:savedIds,read:readIds})); }catch(e){} }

/* ---------- Hilfen ---------- */
const T=k=>UI[lang][k], L=o=>(o&&typeof o==="object")?o[lang]:o;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const loc=()=>lang==="de"?"de-DE":"en-GB";
function toDate(s){const p=s.split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function fmt(s){const p=s.split("-"),x=toDate(s);
  if(p.length===1)return s;
  if(p.length===2)return x.toLocaleDateString(loc(),{month:"long",year:"numeric"});
  return x.toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric"});}
const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;}};
const tcls={ai:"t-ai",sov:"t-sov",esm:"t-esm",tech:"t-tech"};
const byId=id=>ITEMS.find(i=>i.id===id)||ARCHIVE.find(i=>i.id===id);
const NEW_DAYS=7;
function isNew(i){
  if(isArchived(i)||readIds.includes(i.id)) return false;
  const src=i.added||(i.datum.split("-").length===3?i.datum:null); if(!src) return false;
  const n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return (today-toDate(src))/86400000<=NEW_DAYS;
}
function markRead(id){ if(!readIds.includes(id)){readIds.push(id);save();} }
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1600);}

/* ---------- Listen ---------- */
function cardHTML(i){
  const cat=CATS[i.tab][i.cat];
  return `<button class="card ${tcls[i.tab]} ${readIds.includes(i.id)?"read":""} ${isNew(i)?"isnew":""}" data-id="${i.id}">
    <span class="kicker">${isNew(i)?`<span class="newpill">${T("newL")}</span>`:""}${esc(L(cat))}${isArchived(i)?' <span class="archive-tag">· '+T("archiveTag")+'</span>':""}${i.sub?" · "+esc(L(i.sub)):""}${savedIds.includes(i.id)?' <span class="saved-dot" aria-label="'+T("saved")+'">★</span>':""}</span>
    <span class="ttl">${esc(L(i.titel))}</span>
    <span class="src"><span>${esc(i.qn)}</span><span>${fmt(i.datum)}</span><span class="badge">${esc(i.region)}</span></span>
    ${i.metric?`<span class="m">${esc(L(i.metric))}<small>${esc(L(i.msub))}</small></span>`:""}
  </button>`;
}
function renderList(t){
  const cats=CATS[t], f=filt[t];
  const chips=`<div class="chips" role="group"><button class="chip" data-f="" aria-pressed="${!f}">${T("all")}</button>`+
    Object.keys(cats).map(k=>`<button class="chip" data-f="${k}" aria-pressed="${f===k}">${esc(L(cats[k]))}</button>`).join("")+`</div>`;
  const ord=(a,b)=>(isNew(b)-isNew(a))||(toDate(b.added||b.datum)-toDate(a.added||a.datum));
  const list=visibleArticles().filter(i=>i.tab===t&&(!f||i.cat===f));
  const top=list.filter(i=>(i.rel_score||1)>=3).sort(ord), rest=list.filter(i=>(i.rel_score||1)<3).sort(ord);
  const nNew=list.filter(isNew).length;
  const tools=`<div class="toolrow ${tcls[t]}"><span class="nc">${nNew?T("newCount").replace("{n}",nNew):""}</span>${nNew?`<button class="linkbtn" data-markall="${t}">${T("markAll")}</button>`:""}</div>`;
  let body=list.length?"":`<div class="empty">${T("emptyF")}</div>`;
  if(top.length) body+=`<h2>${T("top")}</h2><div class="cards">`+top.map(cardHTML).join("")+`</div>`;
  if(rest.length) body+=`<h2>${T("more")}</h2><div class="cards">`+rest.map(cardHTML).join("")+`</div>`;
  const el=document.getElementById(t);
  el.innerHTML=`${chips}${tools}${body}`;
  el.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{filt[t]=b.dataset.f||null;renderList(t);}));
  const mb=el.querySelector("[data-markall]"); if(mb) mb.addEventListener("click",()=>{ list.filter(isNew).forEach(i=>markRead(i.id)); refreshLists(); });
}
function updateCounts(){ ["ai","esm","sov","tech"].forEach(k=>{ const n=ITEMS.filter(i=>i.tab===k&&isNew(i)).length; const el=document.getElementById("new-"+k); if(el) el.textContent=n?String(n):""; }); }
function renderSaved(){
  const list=savedIds.map(byId).filter(Boolean);
  const missing=savedIds.length-list.length;
  document.getElementById("saved").innerHTML=`<p class="intro">${T("intro_saved")}</p><div class="cards">${list.map(cardHTML).join("")}</div>${missing?`<p class="empty">${T("savedMissing").replace("{n}",missing)}</p>`:""}${savedIds.length?"":`<div class="empty">${T("empty")}</div>`}`;
  document.getElementById("savedCnt").textContent=savedIds.length?String(savedIds.length):"";
}
function renderEvents(){
  const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const h=EVENTS.slice().sort((a,b)=>toDate(a.datum)-toDate(b.datum)).map(e=>{
    const x=toDate(e.datum),end=e.bis?toDate(e.bis):x,days=Math.round((x-today)/86400000),daysEnd=Math.round((end-today)/86400000);
    const cd=daysEnd<0?T("past"):days<=0?T("todayW"):days===1?T("tomorrow"):T("inDays").replace("{n}",days);
    const range=e.bis?(x.getDate()+".–"+end.toLocaleDateString(loc(),{day:"numeric",month:"short"})):"";
    return `<div class="evt t-evt ${daysEnd<0?"past":""}">
      <div class="cal"><span class="dd">${x.getDate()}</span><span class="mm">${x.toLocaleDateString(loc(),{month:"short"})}</span></div>
      <div><h3>${esc(L(e.titel))}</h3>
      <div class="where">${esc(L(e.tag))}, ${esc(L(e.ort))}${range?", "+esc(range):""}</div><p class="note">${esc(L(e.note))}</p>
      <span class="count">${cd}</span> · <a class="evlink" href="${e.url}" target="_blank" rel="noopener">${T("details")}</a></div></div>`;
  }).join("");
  document.getElementById("events").innerHTML=`<h2>${T("upcoming")}</h2><div class="cards">${h}</div>`;
  renderAside();
}
function renderAside(){
  const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const up=EVENTS.filter(e=>toDate(e.bis||e.datum)>=today).sort((a,b)=>toDate(a.datum)-toDate(b.datum)).slice(0,5);
  const counts=["ai","esm","sov","tech"].map(k=>{const c=ITEMS.filter(i=>i.tab===k&&isNew(i)).length;return c?`<li class="${tcls[k]}"><button data-go="${k}"><span>${T("tab_"+k)}</span><b>${c}</b></button></li>`:"";}).join("");
  document.getElementById("aside").innerHTML=
   (counts?`<h2>${T("newL")}</h2><ul class="newlist">${counts}</ul>`:"")+
   `<h2>${T("upcoming")}</h2>`+up.map(e=>{const x=toDate(e.datum);return `<a class="mini t-evt" href="${e.url}" target="_blank" rel="noopener"><span class="md">${x.getDate()}. ${x.toLocaleDateString(loc(),{month:"short"})}</span><span class="mt">${esc(L(e.titel))}</span><span class="mo">${esc(L(e.ort))}</span></a>`;}).join("");
  document.querySelectorAll("#aside [data-go]").forEach(b=>b.addEventListener("click",()=>{searchQuery="";document.getElementById("article-query").value="";tab=b.dataset.go;save();syncTabs();window.scrollTo({top:0});}));
}
/* ---------- Lese-Blatt ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let openId=null,lastFocus=null;
function sheetHTML(i){
  const cat=CATS[i.tab][i.cat],isSaved=savedIds.includes(i.id);
  return `<div class="grab"></div>
   <div class="sheet-top"><span class="kicker">${esc(L(cat))}${i.sub?" · "+esc(L(i.sub)):""} · ${esc(i.region)}</span>
     <button class="x" id="sx" aria-label="${T("close")}">×</button></div>
   ${i.metric?`<div class="big">${esc(L(i.metric))}</div><div class="bigsub">${esc(L(i.msub))}</div>`:""}
   <h3 id="sheetTitle">${esc(L(i.titel))}</h3>
   <p>${esc(L(i.kurz))}</p>
   <div class="client"><b>${i.tab==="tech"?T("forArch"):T("sowhat")}</b>${esc(L(i.rel))}</div>
   <div class="aitag"><span class="aibadge">KI</span>${T("aiTag")}</div>
   <div class="srcline">${esc(i.qn)}, ${fmt(i.datum)}. ${T("opensAt").replace("{d}",esc(domain(i.quelle)))}</div>
   <div class="actions">
     <a class="btn primary" id="sread" href="${i.quelle}" target="_blank" rel="noopener">${T("read")}</a>
     <button class="btn" id="ssave" aria-pressed="${isSaved}">${isSaved?"★ "+T("saved"):"☆ "+T("save")}</button>
     <button class="btn" id="sshare">${T("share")}</button>
   </div>`;
}
function openSheet(id,push=true){
  const i=byId(id); if(!i) return;
  openId=id; lastFocus=document.activeElement; markRead(id); refreshLists();
  sheet.className="sheet "+tcls[i.tab]; sheet.innerHTML=sheetHTML(i);
  requestAnimationFrame(()=>{sheet.classList.add("on");scrim.classList.add("on");});
  document.body.classList.add("locked");
  if(push) history.pushState({sheet:id},"","#"+id);
  openSheet._bind(i);
  document.getElementById("sx").focus();
}
openSheet._bind=function(i){
  const sx=document.getElementById("sx"); sx.onclick=()=>history.back();
  document.getElementById("sread").onclick=()=>{ if(!readIds.includes(i.id)){readIds.push(i.id);save();refreshLists();} };
  document.getElementById("ssave").onclick=()=>{
    const k=savedIds.indexOf(i.id);
    if(k>=0){savedIds.splice(k,1);toast(T("unsavedT"));} else {savedIds.unshift(i.id);toast(T("savedT"));}
    save(); sheet.innerHTML=sheetHTML(i); openSheet._bind(i); refreshLists();
  };
  document.getElementById("sshare").onclick=async()=>{
    const data={title:L(i.titel),text:L(i.titel)+" – "+i.qn,url:i.quelle};
    try{ if(navigator.share){await navigator.share(data);return;} }catch(e){ if(e&&e.name==="AbortError") return; }
    try{ await navigator.clipboard.writeText(i.quelle); toast(T("copied")); }catch(e){ prompt("URL",i.quelle); }
  };
};
function closeSheet(){
  if(!openId) return;
  sheet.classList.remove("on"); scrim.classList.remove("on"); document.body.classList.remove("locked");
  openId=null; if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
scrim.addEventListener("click",()=>history.back());
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&openId) history.back(); });
window.addEventListener("popstate",e=>{
  if(e.state&&e.state.sheet) openSheet(e.state.sheet,false); else closeSheet();
});
document.addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(c) openSheet(c.dataset.id);
});

/* ---------- Steuerung ---------- */
function refreshLists(){ renderSearch(); ["ai","esm","sov","tech"].forEach(renderList); renderSaved(); updateCounts(); if(typeof renderAside==="function"&&document.getElementById("aside")) renderAside(); }
function applyLang(){
  document.documentElement.lang=lang; document.title="esm.business";
  document.querySelectorAll("[data-i]").forEach(el=>{ if(el.dataset.i==="foot2") el.innerHTML=T("foot2"); else el.textContent=T(el.dataset.i); });
  document.getElementById("sub").textContent=T("sub");
  renderSearchFilters(); updateArchiveStatus();
  document.getElementById("article-query").placeholder=T("searchHint");
  document.getElementById("clear-search").setAttribute("aria-label",lang==="de"?"Suche löschen":"Clear search");
  const up=document.getElementById("updated");
  const stamp=META&&META.letzte_recherche;
  up.textContent=stamp?((lang==="de"?"Recherche: ":"Research: ")+new Date(stamp).toLocaleString(loc())):(lang==="de"?"Recherchezeitpunkt nicht bestätigt":"Research time not confirmed");
  if(META&&META.laufstatus==="blocked") up.textContent+=(lang==="de"?" · Letzter Abruf fehlgeschlagen":" · Last retrieval failed");
  if(META&&META.laufstatus==="partial") up.textContent+=(lang==="de"?" · Eingeschränkte Quellenabdeckung":" · Limited source coverage");
  if(META&&META.letzter_artikel) up.textContent+=(lang==="de"?" · Letzte Meldung: ":" · Latest article: ")+fmt(META.letzter_artikel);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
function syncTabs(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",!searchActive()&&b.dataset.tab===tab));
  ["ai","esm","sov","tech","events","saved"].forEach(id=>document.getElementById(id).hidden=searchActive()||id!==tab);
  document.getElementById("search-results").hidden=!searchActive();
  if(tab==="saved"&&savedIds.some(id=>!byId(id))&&archiveState==="idle") ensureArchive();
  updateArchiveStatus();
}
function renderAll(){ applyLang(); refreshLists(); renderEvents(); syncTabs(); if(openId){const i=byId(openId);sheet.innerHTML=sheetHTML(i);openSheet._bind(i);} }
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{searchQuery="";document.getElementById("article-query").value="";tab=b.dataset.tab;save();syncTabs();window.scrollTo({top:0});}));
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;save();renderAll();}));

document.getElementById("article-query").addEventListener("input",e=>{searchQuery=e.target.value;renderSearch();syncTabs();});
document.getElementById("clear-search").addEventListener("click",()=>{searchQuery="";document.getElementById("article-query").value="";syncTabs();document.getElementById("article-query").focus();});
document.getElementById("search-topic").addEventListener("change",e=>{searchTopic=e.target.value;searchCategory="";renderSearchFilters();renderSearch();});
document.getElementById("search-category").addEventListener("change",e=>{searchCategory=e.target.value;renderSearch();});
document.getElementById("include-archive").addEventListener("change",e=>{includeArchive=e.target.checked;refreshLists();updateArchiveStatus();if(includeArchive) ensureArchive();});
document.getElementById("archive-retry").addEventListener("click",ensureArchive);

async function loadData(){
  try{
    const v="?v="+Date.now();
    const [a,b,m]=await Promise.all([fetch("data/items.json"+v).then(r=>r.json()),fetch("data/events.json"+v).then(r=>r.json()),fetch("data/meta.json"+v).then(r=>r.ok?r.json():null).catch(()=>null)]);
    ITEMS=a; EVENTS=b; META=m;
  }catch(e){ console.error("Daten konnten nicht geladen werden",e); }
  renderAll();
}
loadData();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
(function(){const g=document.querySelector('.wm .spin'),l=document.querySelector('.wm .logo');if(!g)return;const go=()=>{g.classList.remove('go');void g.getBoundingClientRect();g.classList.add('go');};requestAnimationFrame(go);l.addEventListener('click',go);})();
history.replaceState({},"",location.pathname+location.search);
</script>
